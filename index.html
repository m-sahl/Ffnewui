<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FestFlow</title>
    <style>
      body { margin: 0; background: #fdfaf9; }
      #fallback {
        display: none;
        position: fixed; inset: 0;
        background: #fdfaf9;
        font-family: 'Inter', sans-serif;
        color: #0f172a;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        z-index: 9999;
      }
      #fallback.show { display: flex; }
      #fallback h2 { font-size: 20px; margin: 0 0 8px; font-weight: 800; }
      #fallback p  { font-size: 13px; color: #64748b; margin: 0 0 24px; line-height: 1.6; max-width: 280px; }
      #fallback button {
        padding: 12px 28px; border-radius: 12px; border: none;
        background: linear-gradient(135deg,#f14d4d,#dc2626);
        color: #ffffff; font-weight: 700; font-size: 14px; cursor: pointer;
      }
    </style>
    <script>
      // If React hasn't mounted after 5s, show fallback with clear button
      window.__ffTimer = setTimeout(function() {
        var root = document.getElementById('root');
        if (!root || !root.hasChildNodes()) {
          document.getElementById('fallback').classList.add('show');
        }
      }, 5000);

      function clearAndReload() {
        try { localStorage.clear(); } catch(e) {}
        try { sessionStorage.clear(); } catch(e) {}
        location.reload(true);
      }
    </script>
  </head>
  <body>
    <div id="fallback">
      <div style="font-size:40px;margin-bottom:16px">⚠️</div>
      <h2>Something went wrong</h2>
      <p>Cached data may be corrupted. Tap below to clear it and reload.</p>
      <button onclick="clearAndReload()">Clear & Reload</button>
    </div>
    <div id="root"></div>
    <script>
      // Also clear timer if React mounts successfully
      var observer = new MutationObserver(function() {
        if (document.getElementById('root').hasChildNodes()) {
          clearTimeout(window.__ffTimer);
          observer.disconnect();
        }
      });
      observer.observe(document.getElementById('root'), { childList: true });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
